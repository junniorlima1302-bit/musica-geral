<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disponibilidades</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* ── BOTÃO RESPOSTAS ── */
    .btn-respostas-status {
      background: #2e7d52;
      color: white;
    }
    .btn-respostas-status:hover { background: #256644; }

    /* ── MODAL OVERLAY ── */
    .modal-status-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: flex-start;
      z-index: 9999;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-status-overlay.aberto { display: flex; }

    .modal-status-box {
      background: #eaf0f8;
      border: 1px solid #c4d4e8;
      border-radius: 16px;
      padding: 24px 20px;
      width: 100%;
      max-width: 460px;
      margin: auto;
      animation: aparecer 0.22s ease;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }

    #conteudo-status {
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
    }

    /* Indicador de arrastar */
    .modal-drag-handle {
      width: 40px; height: 5px;
      background: #a0b8d0;
      border-radius: 3px;
      margin: 0 auto 16px auto;
    }

    @media (max-width: 1023px) {
      .modal-status-overlay {
        align-items: flex-end !important;
        padding: 0 !important;
        background: rgba(0,0,0,0.5) !important;
      }
      .modal-status-box {
        max-height: 95vh !important;
        height: 95vh !important;
        margin: 0 !important;
        border-radius: 20px 20px 0 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        padding: 12px 20px 24px !important;
        transition: transform 0.3s ease !important;
      }
    }

    @keyframes aparecer {
      from { transform: scale(0.92); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .modal-status-titulo {
      font-size: 16px;
      font-weight: 800;
      color: #1a2e4a;
      text-align: center;
      margin-bottom: 16px;
    }

    /* ── BADGES CLICÁVEIS ── */
    .resumo-status {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .resumo-badge-status {
      flex: 1;
      padding: 11px 10px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      border: 3px solid transparent;
    }

    .badge-pendente-s  { background: #fce8d8; color: #8b3a00; }
    .badge-pendente-s:hover  { border-color: #e8a87c; }
    .badge-pendente-s.ativo  { border-color: #c0692b; box-shadow: 0 0 0 2px rgba(192,105,43,0.2); }

    .badge-respondeu-s { background: #d8f0e0; color: #1a4a2a; }
    .badge-respondeu-s:hover { border-color: #7bc49a; }
    .badge-respondeu-s.ativo { border-color: #2e8b57; box-shadow: 0 0 0 2px rgba(46,139,87,0.2); }

    /* ── CARDS DE RESULTADO ── */
    .card-status {
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.09);
    }

    .card-status-header {
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
    }

    .card-status-header.pendente { background: #e8a87c; color: #5a2d00; }
    .card-status-header.ok       { background: #a8d5b5; color: #1a4a2a; }

    .status-item {
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #1a2e4a;
      border-bottom: 1px solid rgba(255,255,255,0.55);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-item:last-child { border-bottom: none; }
    .status-item.pendente-item { background: #fce8d8; }
    .status-item.ok-item       { background: #d8f0e0; }

    .status-item small { font-size: 11px; color: #8b6040; font-weight: 600; }
    .status-item.ok-item small { color: #2e7050; }

    .sem-status {
      text-align: center;
      padding: 18px;
      font-size: 14px;
      color: #7a9ec4;
    }

    .status-loading {
      text-align: center;
      padding: 20px;
      color: #7a9ec4;
      font-size: 14px;
    }

    .btn-fechar-status {
      width: 100%;
      margin-top: 14px;
      padding: 11px;
      background: #a0b8d0;
      color: #1a2e4a;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-fechar-status:hover { background: #8aaac2; }

    .todos-responderam {
      background: #d8f0e0;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      color: #1a4a2a;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 12px;
    }
  
  /* ── POPUP NOTIFICAÇÃO EDITÁVEL ── */
  .popup-notif {
    display: none; position: fixed; top: 0; left: 0;
    width: 100%; height: 100%; background: rgba(0,0,0,0.5);
    justify-content: center; align-items: center; z-index: 99999; padding: 20px;
  }
  .popup-notif.aberto { display: flex; }
  .popup-notif .caixa {
    background: white; border-radius: 16px; padding: 28px 24px;
    width: 100%; max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    animation: aparecer 0.25s ease;
  }
  .popup-notif h3 { font-size: 16px; color: #1a2e4a; margin-bottom: 18px; text-align: center; }
  .popup-notif .campo-label {
    font-size: 11px; font-weight: 700; color: #5a7a9a;
    text-transform: uppercase; letter-spacing: 0.8px; display: block; margin-bottom: 6px;
  }
  .popup-notif input, .popup-notif .notif-textarea {
    width: 100%; border: 1.5px solid #a0b8d0; border-radius: 10px;
    padding: 12px 14px; font-size: 14px; font-family: inherit;
    color: #1a2e4a; margin-bottom: 14px; outline: none; resize: vertical; box-sizing: border-box;
  }
  .popup-notif input:focus, .popup-notif .notif-textarea:focus { border-color: #1b4580; }
  .popup-notif .notif-textarea { min-height: 80px; }
  .popup-notif .acoes { display: flex; gap: 10px; margin-top: 4px; }
  .popup-notif .acoes button { flex: 1; margin-top: 0; padding: 12px; font-size: 14px; border-radius: 10px; }
  .btn-enviar-notif { background: #e67e22 !important; color: white !important; }
  .btn-cancelar-notif { background: #e0e0e0 !important; color: #333 !important; }
</style>

<!-- POPUP NOTIFICAÇÃO EDITÁVEL -->
<div id="popup-notif" class="popup-notif">
  <div class="caixa">
    <h3>🔔 Enviar lembrete</h3>
    <label class="campo-label">Título</label>
    <input type="text" id="notif-titulo" maxlength="80">
    <label class="campo-label">Mensagem</label>
    <textarea class="notif-textarea" id="notif-corpo" maxlength="200"></textarea>
    <div class="acoes">
      <button class="btn-cancelar-notif" onclick="fecharPopupNotif()">Cancelar</button>
      <button class="btn-enviar-notif" onclick="confirmarNotif()">Enviar 🔔</button>
    </div>
  </div>
</div>
</head>

<body class="admin-page" onload="iniciarDisponibilidades()">

  <div class="admin-box">
    <h2>Disponibilidades dos Membros</h2>

    <button onclick="window.location.href='dashboard.html'" class="btn-voltar">← Voltar</button>

    <div id="filtros">
      <select id="filtroMesDisp" onchange="trocarMesDisp()" style="height:36px; padding:0 10px; border-radius:8px; border:1px solid #a0b8d0; font-size:13px; background:white; color:#1a2e4a;">
        <option value="todos">Todos os meses</option>
      </select>

      <select id="filtroMinisterio" onchange="aplicarBusca()">
        <option value="todos">Todos Ministérios</option>
        <option value="Música Geral">Música Geral</option>
        <option value="Geral Eventos">Geral Eventos</option>
      </select>

      <select id="filtroEvento" onchange="aplicarBusca()">
        <option value="todos">Todos os eventos</option>
      </select>

      <select id="filtroTipo" onchange="aplicarBusca()">
        <option value="todos">Cantores e Instrumental</option>
        <option value="canta">🎤 Cantores</option>
        <option value="instrumental">🎸 Instrumental</option>
      </select>

      <div class="busca-box">
        <input type="text" id="buscaNome" oninput="aplicarBusca()" placeholder="Buscar por nome" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')">
      </div>
    </div>

    <div class="barra-acoes-disp">
      <button class="btn-respostas-status" onclick="abrirModalStatus()">👥 Quem respondeu</button>

      <button class="btn-lembrar-push" onclick="lembrarPendentes()" style="background:#e67e22;color:white;">🔔 Lembrar pendentes</button>
    </div>

    <div id="lista-respostas"></div>
  </div>

  <!-- ── MODAL STATUS ── -->
  <div class="modal-status-overlay" id="modal-status" onclick="fecharModalStatusFora(event)">
    <div class="modal-status-box" id="modal-status-box">
      <div class="modal-drag-handle" id="modal-drag-handle"></div>
      <div id="modal-status-titulo-wrap" class="modal-status-titulo" style="display:flex;align-items:center;justify-content:space-between;cursor:grab;">
        <span>👥 Status de Respostas</span>
        <button onclick="carregarStatus()" title="Atualizar" style="background:none;border:none;font-size:18px;cursor:pointer;padding:0;margin:0;min-height:0;width:auto;line-height:1;" id="btn-refresh-status">🔄</button>
      </div>

      <div class="resumo-status">
        <div class="resumo-badge-status badge-pendente-s" id="badge-pendente" onclick="alternarFiltroStatus('pendentes')">
          ⏳ Pendentes: <span id="count-pendentes">—</span>
        </div>
        <div class="resumo-badge-status badge-respondeu-s" id="badge-respondeu" onclick="alternarFiltroStatus('responderam')">
          ✅ Responderam: <span id="count-responderam">—</span>
        </div>
      </div>

      <div id="conteudo-status">
        <div class="status-loading">Carregando...</div>
      </div>

      <button class="btn-fechar-status" onclick="fecharModalStatus()">Fechar</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>

  <script>
    let _statusPendentes = [];
    let _statusOk = [];
    let _statusFiltro = "todos"; // "todos" | "pendentes" | "responderam"
    let _mesDispAtivo = null;

    function popularFiltroEventosPorMes(compromissos) {
      const select = document.getElementById("filtroEvento");
      if (!select) return;
      // Mantém a ordem de cadastro (ordem_grupo), sem sort()
      const vistos = new Set();
      const eventos = [];
      (compromissos || []).forEach(c => {
        if (c.nome && !vistos.has(c.nome)) {
          vistos.add(c.nome);
          eventos.push(c.nome);
        }
      });
      select.innerHTML = `<option value="todos">Todos os eventos</option>`;
      eventos.forEach(e => {
        const opt = document.createElement("option");
        opt.value = e;
        opt.textContent = e;
        select.appendChild(opt);
      });
    }

    // Limpa campo de busca ao carregar (evita autocomplete do browser)
    window.addEventListener('load', function() {
      const busca = document.getElementById('buscaNome');
      if (busca) { busca.value = ''; aplicarBusca(); }
    });

    async function iniciarDisponibilidades() {
      const { data } = await supabase
        .from("disponibilidades")
        .select("mes_ref")
        .not("mes_ref", "is", null);

      const select = document.getElementById("filtroMesDisp");
      const meses = [...new Set((data || []).map(d => d.mes_ref).filter(Boolean))].sort().reverse();

      select.innerHTML = `<option value="todos">Todos os meses</option>`;
      meses.forEach(mes => {
        const [ano, m] = mes.split("-");
        const label = new Date(ano, m - 1).toLocaleString("pt-BR", { month: "long", year: "numeric" });
        const opt = document.createElement("option");
        opt.value = mes;
        opt.textContent = label.charAt(0).toUpperCase() + label.slice(1);
        select.appendChild(opt);
      });

      if (meses.length > 0) {
        _mesDispAtivo = meses[0];
        select.value = meses[0];
      }

      await carregarRespostasComMes();
    }

    async function trocarMesDisp() {
      _mesDispAtivo = document.getElementById("filtroMesDisp").value;
      document.getElementById("filtroEvento").value = "todos";
      await carregarRespostasComMes();
    }

    async function carregarRespostasComMes() {
      const mesParaUsar = (_mesDispAtivo && _mesDispAtivo !== "todos") ? _mesDispAtivo : null;
      const container = document.getElementById("lista-respostas");
      if (container) mostrarLoading("lista-respostas", "Carregando disponibilidades...");

      let compQuery = supabase.from("compromissos").select("*")
        .order("ordem_grupo", { ascending: true, nullsFirst: true })
        .order("ordem_item", { ascending: true, nullsFirst: true });
      if (mesParaUsar) compQuery = compQuery.eq("mes_ref", mesParaUsar);

      // Busca membros pendentes para excluir das respostas
      const { data: pendentes } = await supabase
        .from('membros')
        .select('nome')
        .eq('pendente', true);
      const nomesPendentes = (pendentes || []).map(p => p.nome);

      let dispQuery = supabase.from("disponibilidades").select("*");
      if (mesParaUsar) dispQuery = dispQuery.eq("mes_ref", mesParaUsar);

      try {
        const [resComps, resDisp] = await Promise.all([compQuery, dispQuery]);
        compromissosGlobais = resComps.data || [];
        // Remove respostas de membros ainda pendentes
        const todasRespostas = resDisp.data || [];
        respostasGlobais = todasRespostas.filter(r => !nomesPendentes.includes(r.nome_pessoa));
      } catch (err) {
        console.error(err);
        return;
      }

      popularFiltroEventosPorMes(compromissosGlobais);
      renderizarRespostas(respostasGlobais);
    }

    async function abrirModalStatus() {
      document.getElementById("modal-status").classList.add("aberto");
      document.body.style.overflow = "hidden"; // trava scroll do fundo
      // Sempre recarrega do banco — garante dados em tempo real
      await carregarStatus();
    }

    function fecharModalStatus() {
      document.getElementById("modal-status").classList.remove("aberto");
      document.body.style.overflow = ""; // libera scroll do fundo
    }

    function fecharModalStatusFora(e) {
      if (e.target === document.getElementById("modal-status")) fecharModalStatus();
    }

    async function carregarStatus() {
      document.getElementById("conteudo-status").innerHTML = `<div class="status-loading">Carregando...</div>`;
      const btnRefresh = document.getElementById("btn-refresh-status");
      if (btnRefresh) { btnRefresh.textContent = "⏳"; btnRefresh.disabled = true; }

      // Usa o mês atualmente selecionado no filtro
      const mesAtivo = _mesDispAtivo || document.getElementById("filtroMesDisp")?.value || null;

      // Busca também mes_ref para debug
      let dispQuery = supabase
        .from("disponibilidades")
        .select("nome_pessoa, mes_ref");
      if (mesAtivo && mesAtivo !== "todos") {
        dispQuery = dispQuery.eq("mes_ref", mesAtivo);
      }
      console.log("🔍 Buscando disponibilidades com mes_ref =", mesAtivo);

      const [{ data: membros }, { data: respostas }] = await Promise.all([
        supabase.from("membros").select("*").eq("ativo", true).order("nome"),
        dispQuery
      ]);

      if (!membros) {
        document.getElementById("conteudo-status").innerHTML = `<div class="sem-status">Erro ao carregar dados.</div>`;
        return;
      }

      // Normaliza removendo acentos, espaços duplos e caixa
      function norm(n) {
        return (n || "").trim().toLowerCase()
          .normalize("NFD").replace(/[̀-ͯ]/g, "")
          .replace(/\s+/g, " ");
      }

      console.log("🔍 Respostas retornadas:", (respostas || []).length, "| mes_ref únicos:", [...new Set((respostas||[]).map(r=>r.mes_ref))]);
      // Nomes únicos de quem respondeu — normalizados
      const responderam = new Set(
        (respostas || []).map(r => norm(r.nome_pessoa))
      );

      _statusPendentes = membros.filter(m => !responderam.has(norm(m.nome)));
      _statusOk        = membros.filter(m =>  responderam.has(norm(m.nome)));
      _statusFiltro    = "todos";

      renderizarStatus();
      const btnR = document.getElementById("btn-refresh-status");
      if (btnR) { btnR.textContent = "🔄"; btnR.disabled = false; }
    }

    function exibirTipo(m) {
      if (m.tipo === "toca") return "🎸 " + (m.instrumento || "");
      if (m.tipo === "toca_canta") return "🎸🎤 Toca e Canta" + (m.instrumento ? " — " + m.instrumento : "");
      return "🎤 Canta";
    }

    function renderizarStatus() {
      // Atualiza contadores e badges
      document.getElementById("count-pendentes").textContent  = _statusPendentes.length;
      document.getElementById("count-responderam").textContent = _statusOk.length;

      document.getElementById("badge-pendente").classList.toggle("ativo", _statusFiltro === "pendentes");
      document.getElementById("badge-respondeu").classList.toggle("ativo", _statusFiltro === "responderam");

      const container = document.getElementById("conteudo-status");
      let html = "";

      const mostrarPendentes  = _statusFiltro === "todos" || _statusFiltro === "pendentes";
      const mostrarResponderam = _statusFiltro === "todos" || _statusFiltro === "responderam";

      // ── Pendentes ──
      if (mostrarPendentes) {
        if (_statusPendentes.length === 0) {
          html += `<div class="todos-responderam">🎉 Todos os membros já responderam!</div>`;
        } else {
          const grupos = { "Música Geral": [], "Geral Eventos": [], "Outros": [] };
          _statusPendentes.forEach(m => {
            if (grupos[m.ministerio] !== undefined) grupos[m.ministerio].push(m);
            else grupos["Outros"].push(m);
          });

          ["Música Geral", "Geral Eventos", "Outros"].forEach(min => {
            if (grupos[min].length === 0) return;
            html += `
              <div class="card-status">
                <div class="card-status-header pendente">⏳ Faltando — ${min} (${grupos[min].length})</div>
                ${grupos[min].map(m => `
                  <div class="status-item pendente-item">
                    <span>${m.nome}</span>
                    <small>${exibirTipo(m)}</small>
                  </div>
                `).join("")}
              </div>
            `;
          });
        }
      }

      // ── Responderam ──
      if (mostrarResponderam && _statusOk.length > 0) {
        html += `
          <div class="card-status">
            <div class="card-status-header ok">✅ Já responderam (${_statusOk.length})</div>
            ${_statusOk.map(m => `
              <div class="status-item ok-item">
                <span>${m.nome}</span>
                <small>${exibirTipo(m)}</small>
              </div>
            `).join("")}
          </div>
        `;
      }

      if (!html) html = `<div class="sem-status">Nenhum membro encontrado.</div>`;

      container.innerHTML = html;
    }

    let _resolverNotif = null;

    function abrirPopupNotif(tituloDefault, corpoDefault) {
      document.getElementById("notif-titulo").value = tituloDefault || "";
      document.getElementById("notif-corpo").value = corpoDefault || "";
      document.getElementById("popup-notif").classList.add("aberto");
      return new Promise(resolve => { _resolverNotif = resolve; });
    }

    function fecharPopupNotif() {
      document.getElementById("popup-notif").classList.remove("aberto");
      if (_resolverNotif) { _resolverNotif(null); _resolverNotif = null; }
    }

    async function confirmarNotif() {
      const titulo = document.getElementById("notif-titulo").value.trim();
      const corpo  = document.getElementById("notif-corpo").value.trim();
      if (!titulo || !corpo) { alert("Preencha o título e a mensagem."); return; }
      document.getElementById("popup-notif").classList.remove("aberto");
      if (_resolverNotif) { _resolverNotif({ titulo, corpo }); _resolverNotif = null; }
    }

    async function lembrarPendentes() {
      await carregarStatus();

      if (_statusPendentes.length === 0) {
        alert("🎉 Todos já responderam! Nenhum lembrete necessário.");
        return;
      }

      const dados = await abrirPopupNotif(
        "⏰ Lembrete de disponibilidade!",
        "Você ainda não enviou sua disponibilidade. Acesse o app e responda!"
      );
      if (!dados) return;

      const idsPendentes = _statusPendentes.map(m => m.id);
      const result = await enviarPushTodos(dados.titulo, dados.corpo, idsPendentes);

      if (result) {
        if (result.enviados === 0) {
          alert("⚠️ Nenhum dispositivo encontrado para os membros pendentes.\nEles precisam abrir o app e aceitar as notificações primeiro.");
        } else {
          alert(`✅ Lembrete enviado para ${result.enviados} dispositivo(s)!`);
        }
      } else {
        alert("Erro ao enviar notificação. Tente novamente.");
      }
    }

    function alternarFiltroStatus(filtro) {
      _statusFiltro = _statusFiltro === filtro ? "todos" : filtro;
      renderizarStatus();
    }

    // ── EDIÇÕES ──
    async function carregarEdicoes() {
      const mesAtual = new Date().toISOString().slice(0, 7);

      // Busca pendentes
      const { data: pendentes } = await supabase
        .from('edicoes_disponibilidade')
        .select('*')
        .eq('mes_ref', mesAtual)
        .eq('visto', false)
        .order('criado_em', { ascending: false });

      // Só conta uma pendente por pessoa (a mais recente)
      const pendentesPorPessoa = new Map();
      (pendentes || []).forEach(e => {
        if (!pendentesPorPessoa.has(e.nome_pessoa)) {
          pendentesPorPessoa.set(e.nome_pessoa, e);
        }
      });
      window._edicoesPendentes = [...pendentesPorPessoa.values()];
      const btn = document.getElementById('btn-edicoes-float');
      const badge = document.getElementById('badge-edicoes');
      const nPendentes = window._edicoesPendentes.length;

      // Botão sempre visível
      btn.style.display = 'flex';
      badge.textContent = nPendentes > 0 ? nPendentes : '✓';

      if (nPendentes > 0) {
        btn.classList.remove('sem-pendentes');
      } else {
        btn.classList.add('sem-pendentes');
      }
    }

    function renderizarEdicao(e) {
      const min = e.ministerio || '';
      const isMG = min.toLowerCase().includes('música geral') || min.toLowerCase().includes('musica geral');
      const visto = e.visto;

      const linhasEntrou = (e.entraram || []).map(item => {
        const msg = isMG
          ? `<span style="color:#e74c3c;">❌ Não pode mais servir em: <strong>${item}</strong></span>`
          : `<span style="color:#27ae60;">✅ Passou a poder servir em: <strong>${item}</strong></span>`;
        return `<div style="font-size:12px;margin-top:6px;">${msg}</div>`;
      }).join('');

      const linhasSaiu = (e.sairam || []).map(item => {
        const msg = isMG
          ? `<span style="color:#27ae60;">✅ Voltou a poder servir em: <strong>${item}</strong></span>`
          : `<span style="color:#e74c3c;">❌ Não pode mais servir em: <strong>${item}</strong></span>`;
        return `<div style="font-size:12px;margin-top:6px;">${msg}</div>`;
      }).join('');

      const vistoHtml = visto
        ? `<div style="margin-top:10px;font-size:11px;color:#888;font-style:italic;">
             ✅ Visto por <strong>${e.visto_por || '—'}</strong>
             ${e.visto_em ? '· ' + new Date(e.visto_em).toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : ''}
           </div>`
        : `<button onclick="confirmarEdicaoVista('${e.id}', this)"
             style="margin-top:12px;width:100%;padding:10px;background:#e67e22;color:white;
             border:none;border-radius:8px;font-size:13px;font-weight:700;
             cursor:pointer;font-family:inherit;">
             ✅ Confirmar — Vi esta alteração
           </button>`;

      return `
        <div data-edicao-id="${e.id}" style="border-bottom:1px solid #dde8f0;padding:16px 0;${visto ? 'opacity:0.45;' : ''}">
          <strong style="font-size:14px;color:#1a2e4a;">${e.nome_pessoa}</strong>
          <span style="font-size:11px;color:#7a9ec4;margin-left:8px;">${e.ministerio}</span>
          ${linhasEntrou}
          ${linhasSaiu}
          ${vistoHtml}
        </div>`;
    }

    async function abrirModalEdicoes() {
      const lista = document.getElementById('lista-edicoes');
      const mesAtual = new Date().toISOString().slice(0, 7);

      // Busca TODAS as edições do mês
      const { data: todasEdicoes } = await supabase
        .from('edicoes_disponibilidade')
        .select('*')
        .eq('mes_ref', mesAtual)
        .order('criado_em', { ascending: false });

      if (!todasEdicoes || todasEdicoes.length === 0) {
        lista.innerHTML = '<p style="text-align:center;color:#5a7a9a;padding:20px;">Nenhuma edição este mês.</p>';
      } else {
        // Mantém só a edição mais recente por pessoa
        const ultimasPorPessoa = new Map();
        todasEdicoes.forEach(e => {
          if (!ultimasPorPessoa.has(e.nome_pessoa)) {
            ultimasPorPessoa.set(e.nome_pessoa, e);
          }
        });
        lista.innerHTML = [...ultimasPorPessoa.values()].map(renderizarEdicao).join('');
      }

      document.getElementById('modal-edicoes').classList.add('aberto');
      document.body.style.overflow = 'hidden';
    }

    // Armazena o id e btn pendentes para usar após confirmação de senha
    window._pendingSenhaId  = null;
    window._pendingSenhaBtn = null;

    function confirmarEdicaoVista(id, btn) {
      window._pendingSenhaId  = id;
      window._pendingSenhaBtn = btn;
      document.getElementById('input-senha-confirmacao').value = '';
      document.getElementById('erro-senha').style.display = 'none';
      document.getElementById('modal-senha-overlay').style.display = 'flex';
      setTimeout(() => document.getElementById('input-senha-confirmacao').focus(), 100);
    }

    function fecharModalSenha() {
      document.getElementById('modal-senha-overlay').style.display = 'none';
      window._pendingSenhaId  = null;
      window._pendingSenhaBtn = null;
    }

    async function confirmarSenhaModal() {
      const senha = document.getElementById('input-senha-confirmacao').value;
      if (!senha) return;

      const btnConfirmar = document.getElementById('btn-confirmar-senha');
      btnConfirmar.disabled = true;
      btnConfirmar.textContent = 'Verificando...';

      const { data: sessao } = await supabase.auth.getSession();
      if (!sessao?.session?.user?.email) {
        btnConfirmar.disabled = false;
        btnConfirmar.textContent = 'Confirmar';
        return;
      }

      const { error } = await supabase.auth.signInWithPassword({
        email: sessao.session.user.email,
        password: senha
      });

      btnConfirmar.disabled = false;
      btnConfirmar.textContent = 'Confirmar';

      if (error) {
        document.getElementById('erro-senha').style.display = 'block';
        document.getElementById('input-senha-confirmacao').value = '';
        document.getElementById('input-senha-confirmacao').focus();
        return;
      }

      // Senha correta — registra confirmação
      document.getElementById('modal-senha-overlay').style.display = 'none';

      const id  = window._pendingSenhaId;
      const btn = window._pendingSenhaBtn;

      const { data: eu } = await supabase.from('usuarios').select('nome').eq('id', sessao.session.user.id).single();
      const quemViu = eu?.nome || sessao.session.user.email;
      const agora = new Date().toISOString();

      // Marca todas as edições desta pessoa como vistas (não só a última)
      const nomePessoa = window._edicoesPendentes.find(e => e.id === id)?.nome_pessoa;
      if (nomePessoa) {
        const mesAtual = new Date().toISOString().slice(0, 7);
        await supabase.from('edicoes_disponibilidade')
          .update({ visto: true, visto_por: quemViu, visto_em: agora })
          .eq('nome_pessoa', nomePessoa)
          .eq('mes_ref', mesAtual);
      } else {
        await supabase.from('edicoes_disponibilidade')
          .update({ visto: true, visto_por: quemViu, visto_em: agora })
          .eq('id', id);
      }

      // Torna opaco e mostra quem viu
      const item = document.querySelector(`[data-edicao-id="${id}"]`);
      if (item) {
        item.style.opacity = '0.45';
        btn.replaceWith(Object.assign(document.createElement('div'), {
          innerHTML: `<div style="margin-top:10px;font-size:11px;color:#888;font-style:italic;">✅ Visto por <strong>${quemViu}</strong> · ${new Date(agora).toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>`
        }));
      }

      // Recarrega contagem de pendentes do banco
      await carregarEdicoes();
    }

    async function fecharModalEdicoes() {
      document.getElementById('modal-edicoes').classList.remove('aberto');
      document.body.style.overflow = '';
    }

    carregarEdicoes();
  </script>

  <script>
    // ── Swipe para fechar o modal (estilo iOS sheet) ──
    window.addEventListener('load', function() {
      const box = document.getElementById('modal-status-box');
      const overlay = document.getElementById('modal-status');
      if (!box) return;

      let startY = 0, currentY = 0, isDragging = false;

      function onStart(e) {
        const conteudo = document.getElementById('conteudo-status');
        if (conteudo && conteudo.scrollTop > 0) return;
        startY = e.touches ? e.touches[0].clientY : e.clientY;
        isDragging = true;
        box.style.transition = 'none';
      }

      function onMove(e) {
        if (!isDragging) return;
        currentY = (e.touches ? e.touches[0].clientY : e.clientY) - startY;
        if (currentY < 0) currentY = 0;
        box.style.transform = 'translateY(' + currentY + 'px)';
      }

      function onEnd() {
        if (!isDragging) return;
        isDragging = false;
        box.style.transition = 'transform 0.3s ease';
        if (currentY > 120) {
          box.style.transform = 'translateY(100%)';
          setTimeout(function() {
            fecharModalStatus();
            box.style.transform = '';
          }, 300);
        } else {
          box.style.transform = '';
        }
        currentY = 0;
      }

      // Drag pelo handle e pelo título
      ['modal-drag-handle', 'modal-status-titulo-wrap'].forEach(function(id) {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('touchstart', onStart, { passive: true });
        el.addEventListener('touchmove', onMove, { passive: true });
        el.addEventListener('touchend', onEnd);
      });
    });
  </script>

  <!-- MODAL SENHA -->
  <div id="modal-senha-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:10000;align-items:center;justify-content:center;padding:20px;">
    <div style="background:white;border-radius:20px;padding:28px 24px;width:100%;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,0.25);text-align:center;">
      <div style="font-size:36px;margin-bottom:12px;">🔐</div>
      <h3 style="font-size:16px;font-weight:800;color:#1a2e4a;margin-bottom:6px;">Confirmar identidade</h3>
      <p style="font-size:13px;color:#5a7a9a;margin-bottom:20px;">Digite sua senha para registrar a confirmação</p>
      <input type="password" id="input-senha-confirmacao" placeholder="••••••••"
        style="width:100%;padding:12px 16px;border-radius:10px;border:1.5px solid #a0b8d0;
        font-size:16px;color:#1a2e4a;background:#eaf0f8;margin-bottom:16px;
        box-sizing:border-box;text-align:center;letter-spacing:4px;"
        onkeydown="if(event.key==='Enter') confirmarSenhaModal()">
      <div id="erro-senha" style="color:#e74c3c;font-size:12px;margin-bottom:12px;display:none;">Senha incorreta. Tente novamente.</div>
      <div style="display:flex;gap:10px;">
        <button onclick="fecharModalSenha()" style="flex:1;padding:12px;background:#e0e8f0;color:#1a2e4a;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;">Cancelar</button>
        <button onclick="confirmarSenhaModal()" id="btn-confirmar-senha" style="flex:1;padding:12px;background:#e67e22;color:white;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- MODAL EDIÇÕES -->
  <div class="modal-status-overlay" id="modal-edicoes" onclick="fecharModalEdicoesFora(event)">
    <div class="modal-status-box" id="modal-edicoes-box">
      <div class="modal-drag-handle" id="modal-edicoes-handle"></div>
      <div class="modal-status-titulo" style="display:flex;align-items:center;justify-content:space-between;">
        <span>✏️ Quem Editou</span>
        <button onclick="fecharModalEdicoes()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#5a7a9a;padding:0;width:auto;min-height:0;">×</button>
      </div>
      <div id="lista-edicoes" style="overflow-y:auto;flex:1;padding-right:4px;"></div>

    </div>
  </div>

  <script>
    function fecharModalEdicoesFora(e) {
      if (e.target === document.getElementById('modal-edicoes')) fecharModalEdicoes();
    }
  </script>

  <!-- BOTÃO FLUTUANTE EDIÇÕES -->
  <style>
    @keyframes pulsar {
      0%, 100% { transform: scale(1); box-shadow: 0 4px 16px rgba(230,126,34,0.4); }
      50% { transform: scale(1.08); box-shadow: 0 6px 24px rgba(230,126,34,0.7); }
    }
    #btn-edicoes-float { animation: pulsar 1.6s ease-in-out infinite; }
    #btn-edicoes-float.sem-pendentes {
      animation: none;
      opacity: 0.45;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
  </style>
  <div id="btn-edicoes-float" onclick="abrirModalEdicoes()" style="
    display:none; position:fixed; bottom:24px; right:24px; z-index:998;
    background:#e67e22; color:white; border-radius:50px;
    padding:12px 18px; font-size:13px; font-weight:800;
    cursor:pointer; align-items:center; gap:8px; font-family:inherit;
    transition: opacity 0.3s ease;
  ">
    ✏️ Editaram
    <span id="badge-edicoes" style="background:white;color:#e67e22;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:800;">0</span>
  </div>
